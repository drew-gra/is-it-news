name: CI

# Gate every push and PR on the same checks run locally: typecheck, tests,
# and the library build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth (.nvmrc) so CI and local dev run the same
          # Node/npm — a version mismatch makes npm ci reject a lockfile
          # generated by a different npm major.
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
